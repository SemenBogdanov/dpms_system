<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="DPMS — Digital Production Management System" />
    <meta name="theme-color" content="#f5f5f7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <title>DPMS</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>" />
    <script>
      try {
        var storedTheme = localStorage.getItem('dpms-theme')
        var theme = storedTheme === 'dark' || storedTheme === 'rose' ? storedTheme : 'light'
        document.documentElement.dataset.theme = theme
        document.documentElement.classList.toggle('dark', theme === 'dark')
        document.documentElement.style.colorScheme = theme === 'dark' ? 'dark' : 'light'
      } catch (error) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
    <style>
      .dpms-boot {
        box-sizing: border-box;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f5f5f7;
        color: #334155;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        text-align: center;
      }
      .dpms-boot__panel {
        width: min(100%, 360px);
        border: 1px solid #e2e8f0;
        background: #fff;
        padding: 24px;
      }
      .dpms-boot__spinner {
        width: 32px;
        height: 32px;
        margin: 0 auto 16px;
        border: 3px solid #dbeafe;
        border-top-color: #2563eb;
        border-radius: 50%;
        animation: dpms-spin 0.8s linear infinite;
      }
      .dpms-boot h1 { margin: 0; font-size: 18px; color: #0f172a; }
      .dpms-boot p { margin: 8px 0 0; font-size: 14px; line-height: 1.45; }
      .dpms-boot button {
        min-height: 44px;
        width: 100%;
        margin-top: 18px;
        border: 0;
        border-radius: 8px;
        background: #2563eb;
        color: #fff;
        font: inherit;
        font-weight: 600;
      }
      @keyframes dpms-spin { to { transform: rotate(360deg); } }
    </style>
    <script>
      (function () {
        var bootFinished = false
        var timer = null

        function retry() {
          var url = new URL(window.location.href)
          url.searchParams.set('dpms_reload', String(Date.now()))
          window.location.replace(url.toString())
        }

        function showFailure() {
          if (bootFinished) return
          bootFinished = true
          if (timer) window.clearTimeout(timer)
          var root = document.getElementById('root')
          if (!root) return
          root.innerHTML =
            '<main class="dpms-boot"><section class="dpms-boot__panel">' +
            '<h1>Не удалось загрузить систему</h1>' +
            '<p>Проверьте интернет-соединение и повторите загрузку.</p>' +
            '<button type="button" id="dpms-boot-retry">Повторить</button>' +
            '</section></main>'
          var button = document.getElementById('dpms-boot-retry')
          if (button) button.addEventListener('click', retry)
        }

        window.addEventListener('dpms:ready', function () {
          bootFinished = true
          if (timer) window.clearTimeout(timer)
        }, { once: true })

        window.addEventListener('error', function (event) {
          var target = event.target
          if (target && target.tagName === 'SCRIPT' && target.type === 'module') {
            showFailure()
          }
        }, true)

        timer = window.setTimeout(showFailure, 15000)
      })()
    </script>
  </head>
  <body>
    <div id="root">
      <main class="dpms-boot" aria-live="polite">
        <section class="dpms-boot__panel">
          <div class="dpms-boot__spinner" aria-hidden="true"></div>
          <h1>Загрузка системы</h1>
          <p>Подключаем рабочие разделы.</p>
        </section>
      </main>
    </div>
    <noscript>Для работы DPMS требуется JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
