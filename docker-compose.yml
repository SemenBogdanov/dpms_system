services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dpms
      POSTGRES_USER: dpms_user
      POSTGRES_PASSWORD: dpms_pass
    ports:
      - "${DPMS_DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dpms_user -d dpms"]
      interval: 3s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "${DPMS_BACKEND_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://dpms_user:dpms_pass@db:5432/dpms
      UPLOAD_DIR: /app/uploads
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads

  email-worker:
    build: ./backend
    command: ["python", "-m", "app.workers.email_outbox"]
    environment:
      DATABASE_URL: postgresql+asyncpg://dpms_user:dpms_pass@db:5432/dpms
      EMAIL_DELIVERY_MODE: console
      PUBLIC_APP_URL: http://localhost:${DPMS_FRONTEND_PORT:-5173}
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "${DPMS_FRONTEND_PORT:-5173}:5173"
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    depends_on:
      - backend

volumes:
  pgdata:
