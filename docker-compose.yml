services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dpms
      POSTGRES_USER: dpms_user
      POSTGRES_PASSWORD: dpms_pass
    ports:
      - "${DPMS_DB_PORT:-5436}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dpms_user -d dpms"]
      interval: 3s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "${DPMS_BACKEND_PORT:-8004}:8000"
    env_file:
      - ./deploy/integrations.defaults
    environment:
      DATABASE_URL: postgresql+asyncpg://dpms_user:dpms_pass@db:5432/dpms
      UPLOAD_DIR: /app/uploads
      SERVER_BOOT_SOURCE_ID: local-development
      INTEGRATION_SECRET_KEY: ${INTEGRATION_SECRET_KEY:-local-dev-integration-key-not-for-production-2026}
      AUDIT_TZ_WORKER_ENABLED: "true"
      AUDIT_TZ_EXTERNAL_AI_ENABLED: "true"
      DPMS_WEB_PUSH_PRIVATE_KEY: ${DPMS_WEB_PUSH_PRIVATE_KEY:-}
      DPMS_WEB_PUSH_SUBJECT: ${DPMS_WEB_PUSH_SUBJECT:-mailto:push@example.com}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads

  email-worker:
    build: ./backend
    command: ["python", "-m", "app.workers.email_outbox"]
    environment:
      DATABASE_URL: postgresql+asyncpg://dpms_user:dpms_pass@db:5432/dpms
      EMAIL_DELIVERY_MODE: console
      PUBLIC_APP_URL: http://localhost:${DPMS_FRONTEND_PORT:-5177}
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started

  web-push-worker:
    build: ./backend
    command: ["python", "-m", "app.workers.web_push"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://dpms_user:dpms_pass@db:5432/dpms
      DPMS_WEB_PUSH_PRIVATE_KEY: ${DPMS_WEB_PUSH_PRIVATE_KEY:-}
      DPMS_WEB_PUSH_SUBJECT: ${DPMS_WEB_PUSH_SUBJECT:-mailto:push@example.com}
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started

  deadline-worker:
    build: ./backend
    command: ["python", "-m", "app.workers.deadline_reminders"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "app.workers.deadline_reminders", "--healthcheck"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    environment:
      DATABASE_URL: postgresql+asyncpg://dpms_user:dpms_pass@db:5432/dpms
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started

  audit-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.audit-worker
    command: ["python", "-m", "app.workers.audit_tz"]
    env_file:
      - ./deploy/integrations.defaults
    environment:
      DATABASE_URL: postgresql+asyncpg://dpms_user:dpms_pass@db:5432/dpms
      UPLOAD_DIR: /app/uploads
      INTEGRATION_SECRET_KEY: ${INTEGRATION_SECRET_KEY:-local-dev-integration-key-not-for-production-2026}
      AUDIT_TZ_WORKER_ENABLED: "true"
      AUDIT_TZ_EXTERNAL_AI_ENABLED: "true"
      AUDIT_TZ_RUNTIME_DIR: /app/audit-runtime
      PYTHONDONTWRITEBYTECODE: "1"
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    volumes:
      - ./uploads:/app/uploads:ro
      - audit_tz_runtime:/app/audit-runtime
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128

  server-boot-worker:
    build: ./backend
    command: ["python", "-m", "app.workers.server_boot"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://dpms_user:dpms_pass@db:5432/dpms
      SERVER_BOOT_EVENTS_DIR: /var/lib/dpms-boot-events
      SERVER_BOOT_SOURCE_ID: local-development
      SERVER_BOOT_POLL_SECONDS: "60"
      PYTHONDONTWRITEBYTECODE: "1"
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    volumes:
      - type: bind
        source: ./deploy/stability/fixtures
        target: /var/lib/dpms-boot-events
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 32
    healthcheck:
      test: ["CMD", "python", "-m", "app.workers.server_boot", "--healthcheck"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3

  frontend:
    build: ./frontend
    ports:
      - "${DPMS_FRONTEND_PORT:-5177}:5173"
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    depends_on:
      - backend

volumes:
  pgdata:
  audit_tz_runtime:
