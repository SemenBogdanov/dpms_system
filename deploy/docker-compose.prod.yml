services:
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.prod
    restart: always
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ./integrations.defaults
      - ${DPMS_ENV_FILE:-/opt/dpms/deploy/.env.prod}
    environment:
      AUDIT_TZ_WORKER_ENABLED: ${AUDIT_TZ_WORKER_ENABLED:-true}
      AUDIT_TZ_EXTERNAL_AI_ENABLED: ${AUDIT_TZ_EXTERNAL_AI_ENABLED:-true}
    volumes:
      - ${DPMS_UPLOAD_DIR:-/opt/dpms/uploads}:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  email-worker:
    image: deploy-backend:latest
    command: ["python", "-m", "app.workers.email_outbox"]
    restart: always
    healthcheck:
      disable: true
    env_file:
      - ${DPMS_ENV_FILE:-/opt/dpms/deploy/.env.prod}
    depends_on:
      backend:
        condition: service_healthy

  audit-worker:
    image: deploy-audit-worker:latest
    command: ["python", "-m", "app.workers.audit_tz"]
    restart: always
    healthcheck:
      disable: true
    env_file:
      - ./integrations.defaults
      - ${DPMS_ENV_FILE:-/opt/dpms/deploy/.env.prod}
    environment:
      AUDIT_TZ_WORKER_ENABLED: ${AUDIT_TZ_WORKER_ENABLED:-true}
      AUDIT_TZ_EXTERNAL_AI_ENABLED: ${AUDIT_TZ_EXTERNAL_AI_ENABLED:-true}
      AUDIT_TZ_RUNTIME_DIR: /app/audit-runtime
      PYTHONDONTWRITEBYTECODE: "1"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ${DPMS_UPLOAD_DIR:-/opt/dpms/uploads}:/app/uploads:ro
      - ${DPMS_AUDIT_TZ_RUNTIME_DIR:-/opt/dpms/audit-runtime}:/app/audit-runtime
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
